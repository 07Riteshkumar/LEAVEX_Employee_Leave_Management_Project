<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEAVEX - Employee Leave Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>☑ LEAVEX</h1>
        <h3>Employee Leave Management System</h3>
    </header>

    <main>
        <section class="welcome">
            <h1>Welcome to LEAVEX!</h1>
            <h2>Employee Leave Portal</h2>
            <p>Submit your leave request and get approval.</p>

            <button onclick="applyLeave()">Apply for Leave</button>
        </section>

        <section class="status">
            <h3>Leave Request Status</h3>
            <p id="result">Your leave details will appear here.</p>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
